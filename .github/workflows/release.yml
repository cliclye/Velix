name: Release

# Builds installers on native runners and attaches them to a GitHub Release:
#   macOS  -> .dmg (Apple Silicon + Intel)
#   Windows -> .exe (NSIS installer) + .msi
#   Linux  -> .AppImage + .deb
#
# Trigger: push a tag like v2.1.0, or run it manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-13          # Intel
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Velix ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Downloads
            - **macOS:** `.dmg` (choose `aarch64` for Apple Silicon, `x64` for Intel)
            - **Windows:** `.exe` installer (or `.msi`)
            - **Linux:** `.AppImage` or `.deb`

            These builds are not code-signed. On macOS, right-click the app and choose Open the first time;
            on Windows, choose "More info" then "Run anyway" in SmartScreen.

            See the pull request / commit history for what changed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
